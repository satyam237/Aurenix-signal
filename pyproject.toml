[project]
name = "aurenix-signal"
version = "0.2.0"
description = "AureniX Signal — AI Discovery Optimization (GEO) platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AureniX" }]
keywords = ["GEO", "AI", "brand-visibility", "supabase"]
dependencies = [
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "supabase>=2.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
db = [
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
aurenix-cron = "backend.scheduler.cron_runner:main_cli"
aurenix-pipeline = "backend.agents.prompt_runner.pipeline:cli_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
