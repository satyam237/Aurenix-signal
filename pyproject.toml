[project]
name = "aurenix-signal"
version = "0.1.0"
description = "AureniX Signal — AI Discovery Optimization platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "supabase>=2.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "shared*", "scheduler*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
